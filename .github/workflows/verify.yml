name: Verify Fencekeeper
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
            options: ''
          - os: ubuntu-24.04
            python: '3.13'
            options: ''
          - os: windows-2025
            python: '3.12'
            options: '--allow-windows-symlink-skip'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/validate.py --output new-validation ${{ matrix.options }}
      - run: python tools/check_packaging.py --zipapp dist/fencekeeper-0.1.0.pyz --output new-packaging.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fencekeeper-${{ matrix.os }}-${{ matrix.python }}
          path: |
            new-validation/
            new-packaging.json
